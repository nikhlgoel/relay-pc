<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Share your screen</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: radial-gradient(110% 120px at 0% 0%, rgba(var(--relay-accent-rgb, 82, 136, 193), .22), transparent 100%), var(--relay-1, #111921);
    color: #e6edf3; font: 13.5px/1.35 "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none;
  }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 2px 0 12px; color: #8fa1b3; font-size: 12.5px; }
  .tabs { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.06); }
  .tabs button { padding: 5px 18px; border: 0; border-radius: 999px; background: transparent; color: #8fa1b3; font: inherit; cursor: pointer; transition: background-color .15s, color .15s; }
  .tabs button[aria-pressed="true"] { background: var(--relay-accent, #5288c1); color: var(--relay-on-accent, #fff); }
  .tabs button:not([aria-pressed="true"]):hover { color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 8px 20px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; }
  .card { padding: 8px; border: 2px solid transparent; border-radius: 14px; background: rgba(255,255,255,.045); cursor: pointer; transition: background-color .15s, border-color .15s, transform .15s; animation: pop .22s ease both; }
  .card:hover { background: rgba(255,255,255,.08); }
  .card[aria-selected="true"] { border-color: var(--relay-accent, #5288c1); background: rgba(var(--relay-accent-rgb, 82, 136, 193), .16); }
  .thumb { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 8px; background: var(--relay-0, #0d1319); }
  .name { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 0 2px; }
  .name img { width: 16px; height: 16px; flex: none; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { grid-column: 1 / -1; padding: 40px; text-align: center; color: #6f8398; }
  footer { display: flex; align-items: center; gap: 10px; padding: 12px 24px 18px; border-top: 1px solid rgba(255,255,255,.06); }
  .chk { display: flex; align-items: center; gap: 8px; color: #b6c4d2; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--relay-accent, #5288c1); }
  .chk[hidden] { display: none; }
  .sp { flex: 1; }
  footer button { padding: 8px 20px; border: 0; border-radius: 10px; background: rgba(255,255,255,.07); color: #e6edf3; font: 600 13px "Segoe UI", sans-serif; cursor: pointer; }
  footer button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  footer .primary { background: var(--relay-accent, #5288c1); color: var(--relay-on-accent, #fff); }
  footer .primary:hover:not(:disabled) { background: var(--relay-accent-strong, #639ad9); }
  footer button:disabled { opacity: .45; cursor: default; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 6px; }
</style>
</head>
<body>
  <header>
    <h1>Share your screen</h1>
    <p>Pick a screen or a window. Relay itself is left out.</p>
    <div class="tabs" role="group" aria-label="Source type">
      <button type="button" data-tab="screen" aria-pressed="true">Screens</button>
      <button type="button" data-tab="window" aria-pressed="false">Windows</button>
    </div>
  </header>
  <main id="grid"></main>
  <footer>
    <label class="chk" id="audioRow" hidden><input type="checkbox" id="audio"> Share computer sound</label>
    <span class="sp"></span>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="share" class="primary" disabled>Share</button>
  </footer>
<script>
  const grid = document.getElementById('grid'), share = document.getElementById('share');
  const audioRow = document.getElementById('audioRow'), audio = document.getElementById('audio');
  let data = { sources: [], audio: false }, tab = 'screen', picked = null;

  function draw() {
    grid.replaceChildren();
    const list = data.sources.filter((s) => s.kind === tab);
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing to show here.'; grid.append(e);
    }
    for (const s of list) {
      const card = document.createElement('div');
      card.className = 'card'; card.tabIndex = 0; card.setAttribute('role', 'option');
      card.setAttribute('aria-selected', String(picked === s.id));
      const img = document.createElement('img'); img.className = 'thumb'; img.src = s.thumb; img.alt = '';
      const name = document.createElement('div'); name.className = 'name';
      if (s.icon) { const i = document.createElement('img'); i.src = s.icon; i.alt = ''; name.append(i); }
      const label = document.createElement('span'); label.textContent = s.name; label.title = s.name; name.append(label);
      card.append(img, name);
      const select = () => { picked = s.id; draw(); };
      card.addEventListener('click', select);
      card.addEventListener('dblclick', () => relayPicker.choose(s.id, tab === 'screen' && audio.checked));
      card.addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); select(); } });
      grid.append(card);
    }
    share.disabled = !picked;
    audioRow.hidden = !(data.audio && tab === 'screen');
  }

  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab; picked = null;
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    draw();
  }));
  share.addEventListener('click', () => picked && relayPicker.choose(picked, tab === 'screen' && audio.checked));
  document.getElementById('cancel').addEventListener('click', () => relayPicker.cancel());
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') relayPicker.cancel();
    if (e.key === 'Enter' && picked) relayPicker.choose(picked, tab === 'screen' && audio.checked);
  });
  relayPicker.onData((d) => {
    data = d;
    if (!data.sources.some((s) => s.kind === 'screen') && data.sources.some((s) => s.kind === 'window')) {
      tab = 'window';
      document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.tab === tab)));
    }
    const first = data.sources.find((s) => s.kind === tab);
    picked = first && tab === 'screen' ? first.id : null;
    draw();
  });
</script>
</body>
</html>
