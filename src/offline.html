<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Relay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 140px at 0% 0%, rgba(var(--relay-accent-rgb, 82, 136, 193), .22), transparent 100%), var(--relay-0, #0d1319);
    color: #e6edf3; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none;
  }
  main { max-width: 380px; padding: 24px; text-align: center; animation: in .4s ease both; }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; background: center / contain no-repeat; opacity: .9; }
  h1 { margin: 0 0 8px; font: 500 26px/1.2 "Relay Serif", Georgia, serif; letter-spacing: .2px; }
  p { margin: 0 0 22px; color: #9fb0c1; }
  a {
    display: inline-block; padding: 9px 24px; border-radius: 10px; text-decoration: none; font-weight: 600;
    background: var(--relay-accent, #5288c1); color: var(--relay-on-accent, #fff);
  }
  a:hover { background: var(--relay-accent-strong, #639ad9); }
  small { display: block; margin-top: 18px; color: #6f8398; font-size: 12px; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>
  <main>
    <div class="mark" id="mark"></div>
    <h1>Can't reach WhatsApp</h1>
    <p>Check your internet connection. Relay keeps trying and reconnects on its own.</p>
    <a href="https://web.whatsapp.com/">Try now</a>
    <small id="why"></small>
  </main>
<script>
  const why = new URLSearchParams(location.search).get('c');
  if (why) document.getElementById('why').textContent = why.replace(/^net::/, '');
</script>
</body>
</html>
